<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Link — Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f5f8;color:#171923}
.container{max-width:520px;margin:0 auto;padding:24px 16px 40px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
.brand{font-weight:800;font-size:25px}.muted{color:#737784;font-size:14px;margin-top:5px}
label{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #dddfe5;border-radius:12px;font-size:15px;background:#fff}
textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.total{display:flex;justify-content:space-between;align-items:center;margin:22px 0;padding:16px;border-radius:14px;background:#f5f6f9}
.total strong{font-size:20px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;background:#171923;color:white}
.small{font-size:12px;color:#858995;text-align:center;margin-top:13px;line-height:1.5}
.notice{margin-bottom:16px;padding:12px 14px;background:#f0f1f5;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="brand" id="businessName">ROOM TOURNAMENT ZAKIYA</div>
    <div class="muted">Form pemesanan online</div>

    <div class="notice">Pesanan akan dikirim langsung ke WhatsApp admin.</div>

    <label>Nama</label>
    <input id="name" placeholder="Nama kamu">

    <label>Layanan</label>
    <select id="service" onchange="updateTotal()">
      <option value="Room Tournament 1 Jam" data-price="25000">Room Tournament 1 Jam — Rp25.000</option>
      <option value="Room Tournament 2 Jam" data-price="45000">Room Tournament 2 Jam — Rp45.000</option>
      <option value="Room Tournament 3 Jam" data-price="60000">Room Tournament 3 Jam — Rp60.000</option>
    </select>

    <div class="row">
      <div>
        <label>Tanggal</label>
        <input id="date" type="date">
      </div>
      <div>
        <label>Jam</label>
        <input id="time" type="time">
      </div>
    </div>

    <label>Jumlah</label>
    <input id="qty" type="number" min="1" value="1" onchange="updateTotal()">

    <label>Catatan</label>
    <textarea id="note" placeholder="Contoh: room untuk scrim ZVP Eclipse"></textarea>

    <div class="total">
      <span>Total</span>
      <strong id="total">Rp25.000</strong>
    </div>

    <button class="btn" onclick="sendWhatsApp()">PESAN VIA WHATSAPP</button>
    <div class="small">Demo Order Link • Nomor WhatsApp admin dapat diganti di bagian konfigurasi kode.</div>
  </div>
</div>

<script>
const ADMIN_WA = "6282324643765"; // GANTI dengan nomor WhatsApp admin

function rupiah(n){
  return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
}
function updateTotal(){
  const opt=document.querySelector('#service option:checked');
  const price=Number(opt.dataset.price);
  const qty=Math.max(1,Number(document.getElementById('qty').value)||1);
  document.getElementById('total').textContent=rupiah(price*qty);
}
function sendWhatsApp(){
  const name=document.getElementById('name').value.trim();
  const service=document.getElementById('service').value;
  const opt=document.querySelector('#service option:checked');
  const price=Number(opt.dataset.price);
  const qty=Math.max(1,Number(document.getElementById('qty').value)||1);
  const date=document.getElementById('date').value;
  const time=document.getElementById('time').value;
  const note=document.getElementById('note').value.trim();
  const total=price*qty;

  if(!name || !date || !time){
    alert("Mohon isi Nama, Tanggal, dan Jam terlebih dahulu.");
    return;
  }

  const message =
`Halo Admin ROOM TOURNAMENT CIYA 👋

Saya ingin melakukan pemesanan.

Nama: ${name}
Layanan: ${service}
Jumlah: ${qty}
Tanggal: ${date}
Jam: ${time}
Total: ${rupiah(total)}
Catatan: ${note || "-"}

Mohon konfirmasi ketersediaannya. Terima kasih!`;

  window.open(`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(message)}`,'_blank');
}
updateTotal();
</script>
</body>
</html>
